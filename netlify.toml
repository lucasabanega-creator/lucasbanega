[build]
  command = "npm run check && npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
  SITE_URL = "https://lucasbanega.com"
  PUBLICATION_MODE = "public-prelaunch"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Archivos de Astro con hash en el nombre: caché larga e inmutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Imágenes y logo sin hash en el nombre: caché moderada (1 semana).
# Si se reemplaza una imagen, conviene usar un nombre nuevo.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/logo-banega.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
